[package]
name = "everfall-net"
description = "DTLS 1.2 handshake spike: a dimpl server that proves the crate is wired, without owning the carrier yet."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Sans-IO DTLS 1.2/1.3 engine. `default-features = false` is mandatory, not
# cosmetic: the default set enables `aws-lc-rs`, which builds `aws-lc-sys`, a C
# library. The `rust-crypto` feature selects dimpl's pure-Rust backend instead.
# The version is pinned exactly because a wire-boundary crypto engine is not a
# place to float.
dimpl = { version = "=0.9.0", default-features = false, features = ["rust-crypto"] }

# Pure-Rust X.509 and ECDSA building blocks. Both are already transitive through
# dimpl's `rust-crypto` -> `_crypto-common` set; naming them directly lets us
# mint the ECDSA P-256 self-signed certificate without dimpl's `rcgen` feature,
# which would drag in `aws-lc-rs`.
x509-cert = { version = "=0.3.0", features = ["builder"] }
p256 = { version = "=0.14.0", features = ["pkcs8"] }
ecdsa = { version = "=0.17.0", default-features = false, features = ["der", "alloc"] }
rand = "=0.10.3"

# Wall-clock timestamps for the milestone log.
time = { version = "0.3", features = ["formatting"] }
