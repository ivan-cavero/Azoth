[package]
name = "everfall-net"
description = "DTLS 1.2 handshake spike: an OpenSSL server that presents an RSA 2048 certificate, proving the crate is wired, without owning the carrier yet."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The DTLS engine. `dimpl` (pure Rust, Sans-IO) was tried first and is OUT:
# bound on the REP port it produced no flight at all against twelve 159-byte
# client ClientHellos, dying with `dtls error: timeout: connect`, because the
# client requires an RSA certificate and dimpl lists RSA as a non-goal. OpenSSL
# does RSA and ECDSA, is the audited stack the Python lab already uses through
# pyOpenSSL, and is what `docs/PLAN.md` prescribes for this crate.
#
# This links a prebuilt OpenSSL development package (see `server/README.md`),
# NOT the `vendored` feature: building OpenSSL from source drags in a C toolchain
# and Perl, and on this machine it is reproducibly broken by the compiler's PDB
# handling. The package location is recorded in `server/.cargo/config.toml`.
openssl = "0.10"

# Wall-clock timestamps for the milestone log and the certificate serial.
time = { version = "0.3", features = ["formatting"] }

# The REP carrier layer. `everfall-net` still owns sockets and DTLS; the binary
# hands each decrypted datagram to `everfall-world`, which owns the protocol
# decision and returns the datagrams to send. This does not invert a boundary:
# `everfall-world` depends on neither this crate nor a socket.
everfall-world = { path = "../everfall-world" }
