[workspace]
resolver = "3"
members = [
    "crates/azoth-model",
    "crates/azoth-wire",
    "crates/azoth-region",
    "crates/azoth-http",
    "crates/azoth-dtls",
    "crates/azoth-session",
    "crates/azoth-store",
    "crates/azoth-commands",
    "crates/azoth-privacy",
    "apps/channeld",
    "apps/regiond",
    "apps/worldd",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# No third-party runtime dependency is declared yet. The wire codecs are pure
# std on purpose: they are the crate every other crate depends on, so their
# dependency tree must stay empty until a measured need adds one (plan §18).
anyhow = "1"
# Serialization for the client's HTTP contract. serde is the ecosystem standard and
# serde_json is what renders the exact byte shape the client parses.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The HTTP stack. Plan section 18.4 chose axum/hyper over actix and over a
# hand-rolled server: it targets the same runtime as the rest of the stack, and
# the two quirks this client needs (HTTP/1.1 with Content-Length, TCP_NODELAY)
# are already solved in azoth-http rather than re-derived here.
axum = "0.8"
# `tower`'s `util` feature provides `ServiceExt::oneshot`, which is how the route tests drive the
# real axum router without binding a socket. It is already in the tree as axum's own dependency; the
# feature is the only addition, and it is a dev-dependency of the crate that needs it.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# The identity and world databases. SQLite with the C library bundled, so a build needs no
# system SQLite and no installer on the target machine (plan §9.1). The driver is blocking on
# purpose: it makes calling the database from an async hot path impossible instead of merely
# discouraged, so every access has to go through `spawn_blocking` or a persistence thread.
rusqlite = { version = "0.37", features = ["bundled"] }
# The DTLS transport. `openssl` is the only library in the tree that can negotiate
# `0xC030` as a DTLS 1.2 server (docs/archive/odd-tasks/dtls-spike.md L2/L5); `dtls` lacks the suite
# and `rustls` has no DTLS at all. The `vendored` feature is deliberately NOT enabled:
# the crate's bundled source is incomplete and `Configure` refuses, so the build uses
# MSYS2's packaged OpenSSL 3.6.5 (see `rust-toolchain.toml`).
openssl = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A codec reads and writes byte offsets; being explicit about arithmetic is the
# point, not noise.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Documented layout tables read better as constants than as methods.
items_after_statements = "allow"
