[package]
name = "regiond"
description = "The region: identity, entitlements, the login queue and the world list."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
azoth-http = { path = "../../crates/azoth-http" }
azoth-privacy = { path = "../../crates/azoth-privacy" }
azoth-region = { path = "../../crates/azoth-region" }
azoth-store = { path = "../../crates/azoth-store" }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# `ServiceExt::oneshot` drives the real router in `tests/login.rs` without binding a socket, so the
# tests exercise the same axum stack the binary serves.
tower = { workspace = true }
