name: check

on:
  push:
    branches: [refactor/knowledge-os, main, master]
  pull_request:

jobs:
  docs-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Doc / path / script catalog gates
        run: |
          python scripts/check/check-docs.py
          python scripts/check/check-paths.py
          python scripts/check/check-scripts.py

  # Rust returns when research/atlas/meanings.md closes a row. See docs/PLAN.md.
